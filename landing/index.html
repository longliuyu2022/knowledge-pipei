<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="同知，让知识画像、问题讨论和深入交流相连。同题与同频的合并项目筹备中。">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8f9fc">
    <title>同知 · 因问题相聚，因知识同频</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="brand" href="/" aria-label="同知首页"><span class="brand-mark" aria-hidden="true">知</span><span>同知</span></a>
        <span class="status"><span aria-hidden="true"></span>合并版筹备中</span>
      </header>
      <main>
        <section class="intro" aria-labelledby="intro-title">
          <p class="eyebrow">同题 × 同频</p>
          <h1 id="intro-title">因问题相聚，<br>因知识<span class="accent">同频。</span></h1>
          <p class="lead">认识自己的知识兴趣，找到共同关心的问题。<br class="desktop-break">让一次认真讨论，成为更深理解的开始。</p>
          <div class="path" aria-label="新项目的知识探索路径">
            <span>认识自己</span><span class="arrow" aria-hidden="true">→</span><span>共同求解</span><span class="arrow" aria-hidden="true">→</span><span>深入交流</span>
          </div>
        </section>
        <section class="experiences" aria-labelledby="experiences-title">
          <div class="section-intro">
            <h2 id="experiences-title">先从这里开始</h2>
            <p>合并版正在筹备，两个现有产品已可体验。</p>
          </div>
          <div class="cards">
            <a class="card" href="https://zhihushequn.aiimage.icu">
              <span class="card-number" aria-hidden="true">01 / 同一个问题</span>
              <h3>同题<span aria-hidden="true">↗</span></h3>
              <p>带着具体问题来，和真正关心它的人交换经验、寻找资料，把讨论整理成有依据的成果。</p>
              <span class="card-link">体验现有同题 <span aria-hidden="true">→</span></span>
            </a>
            <a class="card card-blue" href="https://zhihupipei.aiimage.icu">
              <span class="card-number" aria-hidden="true">02 / 相近的好奇心</span>
              <h3>同频<span aria-hidden="true">↗</span></h3>
              <p>了解自己的知识兴趣与交流偏好，发现愿意认真交换想法的人，从一个好问题开始对话。</p>
              <span class="card-link">体验现有同频 <span aria-hidden="true">→</span></span>
            </a>
          </div>
        </section>
      </main>
      <footer><span>同知 · 知乎 Hackathon 参赛项目筹备</span><span>zhihu.aiimage.icu</span></footer>
    </div>
  </body>
</html>
